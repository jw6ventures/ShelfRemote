# qmllint configuration for the ShelfRemote QML module. Applied automatically by
# the `all_qmllint` build target, which CI runs.
#
# Verified against qmllint 6.7.3, the version CI installs. Category *keys* were
# renamed in Qt 6.5, so the pre-6.5 spellings are kept alongside the current ones:
# qmllint ignores keys it does not recognise, which makes carrying both harmless
# and keeps a local build on an older Qt behaving the same as CI.
#
# Everything not listed keeps the level qmllint ships with, so a syntax error, an
# unresolvable import, a typo'd component name, a bad signal handler, a missing
# required property, or a deprecated API still fails the build.
[Warnings]
# The 10-foot UI reads singletons (Theme, Playback, Backend, ...) and `parent`
# unqualified throughout, which is ordinary QML style but accounts for 166 of the
# 169 findings on the current tree. Leaving it on would bury everything else.
UnqualifiedAccess=disable

# Kept visible but not fatal. Both findings are in Playlists.qml, reading
# `playlistEntries`/`playlistName` off ListView.currentItem: that is a correct and
# idiomatic way to reach the current delegate, but currentItem is typed only as
# QQuickItem, so no static check can see the delegate's own properties. The check
# also has limited reach here regardless, because the C++ objects the UI talks to
# are context properties and therefore untyped to qmllint.
MissingProperty=info

# Pre-6.5 spelling of the same group of checks, for older local Qt installs.
TypeError=info
