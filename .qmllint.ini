# qmllint configuration for the ShelfRemote QML module. Applied automatically by
# the `all_qmllint` build target, which CI runs.
#
# Only two categories are moved off their defaults; everything else stays at the
# level qmllint ships with, so a broken import, a bad signal handler, a missing
# required property, or a deprecated API still fails the build.
[Warnings]
# The 10-foot UI reads singletons (Theme, Playback, Backend, ...) and `parent`
# unqualified throughout, which is ordinary QML style but accounts for every one
# of the ~160 findings in this category. Leaving it on would bury everything else.
UnqualifiedAccess=disable

# Kept visible but not fatal. The remaining findings here are limits of static
# analysis rather than defects: the type of a ternary between two Items, the
# properties of a ListView delegate reached through `currentItem` (typed only as
# QQuickItem), and Qt.callLater being a QJSValue rather than a Q_INVOKABLE.
TypeError=info
